  <text x="20" y="137" font-size="10" fill="#55ffff" font-family="'Courier New',monospace" font-weight="normal">──────────────────────────────────────────────────────────────────────────</text>
  <text x="20" y="157" font-size="14" fill="#ffff55" font-family="'Courier New',monospace" font-weight="bold">What can I do?</text>
  <text x="20" y="177" font-size="11" fill="#55ffff" font-family="'Courier New',monospace" font-weight="normal">  Please try again in a few minutes.  ·  Check your DNS Settings. A 523 error means that Cloudflare could not reach your host web server. The most common cause is that your DNS settings are incorrect. Please contact your hosting provider to confirm your origin IP and then make sure the correct IP is listed for your A record in your Cloudflare DNS Settings page.Additional    troubleshooting information here.</text>
